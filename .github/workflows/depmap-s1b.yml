name: Render DepMap Supplementary Figure S1B

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/depmap-s1b.yml"
      - "data/analysis/depmap_s1b_eligible_models.tsv.gz"
      - "data/analysis/depmap_s1b_preparation_qc.json"
      - "data/analysis/depmap_s1b_source_provenance.json"
      - "reference_results/depmap_s1b_statistics.csv"
      - "scripts/prepare_depmap_s1b.py"
      - "scripts/verify_depmap_s1b_outputs.py"
      - "R/11_supplementary_1B.R"
      - "renv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/depmap-s1b.yml"
      - "data/analysis/depmap_s1b_eligible_models.tsv.gz"
      - "data/analysis/depmap_s1b_preparation_qc.json"
      - "data/analysis/depmap_s1b_source_provenance.json"
      - "reference_results/depmap_s1b_statistics.csv"
      - "scripts/prepare_depmap_s1b.py"
      - "scripts/verify_depmap_s1b_outputs.py"
      - "R/11_supplementary_1B.R"
      - "renv.lock"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true
      - name: Restore the locked R environment
        uses: r-lib/actions/setup-renv@v2
      - name: Render the checksum-pinned descriptive panel
        run: Rscript R/11_supplementary_1B.R
      - name: Verify image and numerical provenance contracts
        run: python3 scripts/verify_depmap_s1b_outputs.py
      - name: Archive the exact R lock used for rendering
        run: |
          cp renv.lock results/supplementary_S1B/renv.lock
          cd results/supplementary_S1B
          sha256sum renv.lock > renv.lock.sha256
      - name: Upload Supplementary Figure S1B
        uses: actions/upload-artifact@v4
        with:
          name: depmap-supplementary-figure-s1b
          path: results/supplementary_S1B/
          if-no-files-found: error
          retention-days: 14
