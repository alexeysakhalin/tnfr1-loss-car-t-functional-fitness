name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m py_compile scripts/*.py validation/*.py tests/*.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/fetch_public_sources.py --list

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
      - name: Parse every R script
        shell: Rscript {0}
        run: |
          paths <- list.files("R", pattern = "[.]R$", full.names = TRUE)
          failures <- vapply(paths, function(path) {
            tryCatch({ parse(file = path); FALSE }, error = function(error) {
              message(path, ": ", conditionMessage(error)); TRUE
            })
          }, logical(1))
          if (any(failures)) quit(status = 1)
