name: Rebuild bulk RNA-seq figures

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/bulk-rnaseq.yml"
      - "data/experimental/bulk_rnaseq/**"
      - "requirements-bulk-rnaseq.in"
      - "requirements-bulk-rnaseq.txt"
      - "scripts/run_bulk_rnaseq_pydeseq2.py"
      - "scripts/verify_bulk_figure_outputs.py"
      - "scripts/verify_bulk_rnaseq_release.py"
      - "scripts/write_runtime_provenance.py"
      - "tests/test_verify_bulk_rnaseq_release.py"
      - "renv.lock"
      - "R/03_figure_1_B_C.R"
      - "R/04_figure_2_B_suppl_S2D.R"
      - "R/bulk_rnaseq_figure_helpers.R"
      - "R/render_bulk_rnaseq_figures.R"

permissions:
  contents: read

jobs:
  differential-expression:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-bulk-rnaseq.txt
      - name: Install the locked bulk RNA-seq environment
        run: |
          python -m pip install pip==25.0.1
          python -m pip install --requirement requirements-bulk-rnaseq.txt
      - name: Fit primary and interaction models
        run: >-
          python scripts/run_bulk_rnaseq_pydeseq2.py
          --input-dir data/experimental/bulk_rnaseq
          --output-dir results/bulk_rnaseq
          --include-interaction
          --n-cpus 2
      - name: Record CI runtime provenance
        run: >-
          python scripts/write_runtime_provenance.py
          --output results/bulk_rnaseq/runtime_provenance.json
      - name: Verify complete result exports
        run: >-
          python scripts/verify_bulk_rnaseq_release.py
          --generated-dir results/bulk_rnaseq
          --release-dir data/experimental/bulk_rnaseq/derived
          --report results/bulk_rnaseq/release_comparison_report.json
      - name: Upload complete DE results and comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-rnaseq-results
          path: results/bulk_rnaseq/
          if-no-files-found: error
          retention-days: 14

  manuscript-figures:
    needs: differential-expression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: bulk-rnaseq-results
          path: results/bulk_rnaseq
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true
      - name: Restore the locked R figure environment
        uses: r-lib/actions/setup-renv@v2
      - name: Confirm the outcome gate and committed release inputs
        run: |
          python -c 'import json; from pathlib import Path; report = json.loads(Path("results/bulk_rnaseq/release_comparison_report.json").read_text()); assert report["status"] == "passed"'
          cd data/experimental/bulk_rnaseq/derived
          sha256sum --check SHA256SUMS
      - name: Render figures from the committed canonical adapters
        run: Rscript R/render_bulk_rnaseq_figures.R
      - name: Verify publication figure and numeric output contracts
        run: python3 scripts/verify_bulk_figure_outputs.py
      - name: Archive the exact R lock used for rendering
        run: |
          mkdir -p results/release
          cp renv.lock results/release/renv_bulk_figures.lock
          cmp renv.lock results/release/renv_bulk_figures.lock
          cd results/release
          sha256sum renv_bulk_figures.lock > renv_bulk_figures.lock.sha256
      - name: Upload manuscript-ready figure outputs
        uses: actions/upload-artifact@v4
        with:
          name: bulk-rnaseq-manuscript-figures
          path: |
            figures/figure_1/
            figures/figure_2/
            results/figure_1/
            results/figure_2/
            results/release/sessionInfo_bulk_figures.txt
            results/release/renv_bulk_figures.lock
            results/release/renv_bulk_figures.lock.sha256
          if-no-files-found: error
          retention-days: 14
